<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-labelledby="qt qd">
<title id="qt">The two path shapes</title>
<desc id="qd">A two-hop path runs from a drug to a gene to the disease. A three-hop path adds a protein interaction step, which is what reaches diseases whose own gene has no drug against it.</desc>
<rect width="1180" height="430" fill="#ffffff"/>
<defs>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="#8a8a93"/>
</marker>
</defs>

<g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="26" font-weight="600" fill="#16161a">Why a drug gets suggested</text>
<text x="40" y="80" font-size="16" fill="#5b5b63">Each path is divided by how connected its genes and drugs are, so a route through a hub counts for less.</text>

<text x="40" y="132" font-size="15" font-weight="600" fill="#5b5b63">Two hops</text>
<rect x="40" y="148" width="180" height="62" rx="10" fill="#e1f5ee" stroke="#1d9e75"/>
<text x="130" y="185" font-size="17" font-weight="600" fill="#085041" text-anchor="middle">drug</text>
<rect x="320" y="148" width="180" height="62" rx="10" fill="#eeedfe" stroke="#7f77dd"/>
<text x="410" y="185" font-size="17" font-weight="600" fill="#3c3489" text-anchor="middle">gene</text>
<rect x="600" y="148" width="180" height="62" rx="10" fill="#f1efe8" stroke="#888780"/>
<text x="690" y="185" font-size="17" font-weight="600" fill="#2c2c2a" text-anchor="middle">disease</text>
<path d="M220 179 L314 179" stroke="#8a8a93" stroke-width="2" marker-end="url(#b)"/>
<text x="267" y="170" font-size="13" fill="#5b5b63" text-anchor="middle">targets</text>
<path d="M500 179 L594 179" stroke="#8a8a93" stroke-width="2" marker-end="url(#b)"/>
<text x="547" y="170" font-size="13" fill="#5b5b63" text-anchor="middle">associated with</text>

<text x="40" y="288" font-size="15" font-weight="600" fill="#5b5b63">Three hops</text>
<rect x="40" y="304" width="155" height="64" rx="10" fill="#e1f5ee" stroke="#1d9e75"/>
<text x="117" y="334" font-size="16" font-weight="600" fill="#085041" text-anchor="middle">nitisinone</text>
<text x="117" y="354" font-size="12" fill="#0f6e56" text-anchor="middle">approved drug</text>
<rect x="285" y="304" width="155" height="64" rx="10" fill="#eeedfe" stroke="#7f77dd"/>
<text x="362" y="334" font-size="16" font-weight="600" fill="#3c3489" text-anchor="middle">HPD</text>
<text x="362" y="354" font-size="12" fill="#534ab7" text-anchor="middle">druggable</text>
<rect x="530" y="304" width="155" height="64" rx="10" fill="#eeedfe" stroke="#7f77dd"/>
<text x="607" y="334" font-size="16" font-weight="600" fill="#3c3489" text-anchor="middle">HGD</text>
<text x="607" y="354" font-size="12" fill="#534ab7" text-anchor="middle">no drug exists</text>
<rect x="775" y="304" width="175" height="64" rx="10" fill="#f1efe8" stroke="#888780"/>
<text x="862" y="342" font-size="16" font-weight="600" fill="#2c2c2a" text-anchor="middle">alkaptonuria</text>
<path d="M195 336 L279 336" stroke="#8a8a93" stroke-width="2" marker-end="url(#b)"/>
<text x="237" y="327" font-size="13" fill="#5b5b63" text-anchor="middle">targets</text>
<path d="M440 336 L524 336" stroke="#8a8a93" stroke-width="2" marker-end="url(#b)"/>
<text x="482" y="327" font-size="13" fill="#5b5b63" text-anchor="middle">interacts 0.999</text>
<path d="M685 336 L769 336" stroke="#8a8a93" stroke-width="2" marker-end="url(#b)"/>
<text x="727" y="327" font-size="13" fill="#5b5b63" text-anchor="middle">causes</text>

<text x="40" y="405" font-size="14" fill="#5b5b63">The third hop reaches diseases whose own gene is undruggable. Nitisinone is the real approved treatment for alkaptonuria, and this is really how it works.</text>
</g>
</svg>
