<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 400" width="1180" height="400" role="img" aria-labelledby="pt pd">
<title id="pt">Off The Shelf pipeline</title>
<desc id="pd">Open Targets data is fetched and cached, scored over drug-gene-disease paths, validated against known treatments, and served as a static site that needs no network.</desc>
<rect width="1180" height="400" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 L10 5 L0 10 z" fill="#8a8a93"/>
</marker>
</defs>

<g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="26" font-weight="600" fill="#16161a">How Off The Shelf works</text>
<text x="40" y="80" font-size="16" fill="#5b5b63">Everything left of the dashed line runs once, offline. The demo only ever reads files.</text>

<rect x="40" y="120" width="190" height="96" rx="10" fill="#eeedfe" stroke="#7f77dd"/>
<text x="135" y="155" font-size="17" font-weight="600" fill="#3c3489" text-anchor="middle">Open Targets</text>
<text x="135" y="177" font-size="14" fill="#534ab7" text-anchor="middle">genes, drugs,</text>
<text x="135" y="195" font-size="14" fill="#534ab7" text-anchor="middle">interactions</text>

<rect x="285" y="120" width="190" height="96" rx="10" fill="#f1efe8" stroke="#888780"/>
<text x="380" y="155" font-size="17" font-weight="600" fill="#2c2c2a" text-anchor="middle">Fetch and cache</text>
<text x="380" y="177" font-size="14" fill="#5f5e5a" text-anchor="middle">100 diseases</text>
<text x="380" y="195" font-size="14" fill="#5f5e5a" text-anchor="middle">saved to disk</text>

<rect x="530" y="120" width="190" height="96" rx="10" fill="#e1f5ee" stroke="#1d9e75"/>
<text x="625" y="155" font-size="17" font-weight="600" fill="#085041" text-anchor="middle">Score</text>
<text x="625" y="177" font-size="14" fill="#0f6e56" text-anchor="middle">degree-weighted</text>
<text x="625" y="195" font-size="14" fill="#0f6e56" text-anchor="middle">path counting</text>

<rect x="775" y="120" width="190" height="96" rx="10" fill="#faeeda" stroke="#ba7517"/>
<text x="870" y="155" font-size="17" font-weight="600" fill="#633806" text-anchor="middle">Validate</text>
<text x="870" y="177" font-size="14" fill="#854f0b" text-anchor="middle">rank drugs already</text>
<text x="870" y="195" font-size="14" fill="#854f0b" text-anchor="middle">known to work</text>

<rect x="955" y="268" width="185" height="90" rx="10" fill="#e6f1fb" stroke="#378add"/>
<text x="1047" y="300" font-size="17" font-weight="600" fill="#0c447c" text-anchor="middle">Web app</text>
<text x="1047" y="322" font-size="14" fill="#185fa5" text-anchor="middle">reads static files</text>
<text x="1047" y="341" font-size="14" fill="#185fa5" text-anchor="middle">no network</text>

<path d="M230 168 L279 168" stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"/>
<path d="M475 168 L524 168" stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"/>
<path d="M720 168 L769 168" stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"/>
<path d="M625 216 L625 313 L949 313" fill="none" stroke="#8a8a93" stroke-width="2" marker-end="url(#a)"/>
<text x="648" y="303" font-size="13" fill="#8a8a93">ranked results written as JSON files</text>

<path d="M925 100 L925 380" stroke="#cfcdc7" stroke-width="2" stroke-dasharray="6 6"/>
<text x="917" y="96" font-size="13" fill="#8a8a93" text-anchor="end">runs once, offline</text>
<text x="933" y="96" font-size="13" fill="#8a8a93">demo day</text>
</g>
</svg>
